<!DOCTYPE html>
<html>

<head>
  <meta charSet="utf-8" />
  <title>{{.sitename}} - {{.station.name}}</title>
  <meta name='pagename' content="{{.sitename}} - {{.station.name}}">

  <meta name='coverage' content='Worldwide'>
  <meta name='distribution' content='Global'>
  <meta name='target' content='all'>
  
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <meta name="theme-color" content="#00a1f7" />

  <meta name="twitter:card" content="summary" />

  <meta property="og:locale" content={{.Language}} />

  <meta content="yes" name="apple-mobile-web-app-capable" />

  {{range .Languages}}
    <meta property="og:locale:alternate" content={{.}} />
  {{end}}

  <meta property="og:site_name" content="{{$.sitename}}" />

  <meta property="og:title" content="{{.sitename}} - {{.station.name}}" />
  <meta name="twitter:title" content="{{.sitename}} - {{.station.name}}" />

  <meta name="description" content="{{.text_description}} {{.Tags}}: {{range .station.tags}}{{.}},{{end}}" />
  <meta property="og:description" content="{{.text_description}} {{.Tags}}: {{range .station.tags}}{{.}},{{end}}" />
  <meta property="twitter:description" content="{{.text_description}} {{.Tags}}: {{range .station.tags}}{{.}},{{end}}" />

  <meta name="subject" content="{{.Description}} {{.Tags}}: {{range .station.tags}}{{.}},{{end}}" />

  <meta name='copyright' content='radio.best'>

  <meta name='robots' content='index,follow'>

  <meta name='keywords' content="{{.sitename}},{{.station.name}},{{range .station.tags}}{{.}},{{end}}">

  <meta property="og:image" content={{.logo}} />
  <meta property="twitter:image" content={{.logo}} />

  <link rel="canonical" href="{{.Domain}}{{.URL}}" />

  <meta property="og:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:domain" content="{{.Domain}}" />

  <script type="application/ld+json">
    {"@context": "https://schema.org",
      "@type": "Radiostations",
      "name": "{{.sitename}}",
      "description": "{{.text_description}}",
      "availableLanguage": [
        {
          "@type": "Language",
          "name": "English"
        },
        {
          "@type": "Language",
          "name": "Russian",
        }
      ],
      "keywords": "{{range .station.tags}}{{.}},{{end}}",
      "logo": {{.quoted_logo}},
      "url": {{.Full_url}}}
  </script>
</head>

<body>
  <p>{{$.sitename}} - {{.station.name}}</p>
  {{.text_description}}
  <p>
    {{.Tags}}:
    {{range .station.tags}}
      <a href="{{$.Domain}}/?language={{$.Language}}&tags={{.}}">{{.}}</a>,
    {{end}}
  </p>
  <p>
    <p>
      {{.links_to_page_on_other_languages}}:
    </p>
    {{range .Languages}}
      <a rel="alternate" hreflang="{{.}}" href="{{$.Domain}}/station/{{$.station.id}}?language={{.}}">{{.}} - {{$.station.name}}</a>,
    {{end}}
  </p>
  <p>
    <a href="{{.Domain}}?language={{.Language}}">{{.Language}} - {{$.sitename}}</a>,
  </p>
</body>

</html>
