<!DOCTYPE html>
<html>

<head>
  <meta charSet="utf-8" />
  <title>{{.sitename}}</title>
  <meta name="theme-color" content="#00a1f7" />

  <link rel="mask-icon" href="" color="#00a1f7" />

  <link rel="icon" href="" />

  <link rel="apple-touch-icon" href="" />

  <meta name="twitter:card" content="summary" />

  <meta property="og:locale" content={{.Language}} />

  {{range .Languages}}
    <meta property="og:locale:alternate" content={{.}} />
  {{end}}

  <meta property="og:site_name" content="{{.sitename}}" />

  <meta property="og:title" content="{{.sitename}}" />
  <meta name="twitter:title" content="{{.sitename}}" />

  <meta name="description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />
  <meta property="og:description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />
  <meta property="twitter:description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />

  <link rel="canonical" href="{{.Domain}}{{.URL}}" />

  <meta property="og:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:domain" content="{{.Domain}}" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Radiostations",
      "name": "{{.sitename}}",
      "description": "{{.Description}}",
      "availableLanguage": [
        {
          "@type": "Language",
          "name": "English"
        },
        {
          "@type": "Language",
          "name": "Russian",
        }
      ],
      "keywords": "{{range .Tags_list}}{{.}},{{end}}",
      "url": {{.Full_url}}
    }
  </script>
</head>

<body>
  <p>
    {{.Description}}
  </p>
  <p>
    {{.Tags}}:
    {{range .Tags_list}}
      <a href="{{$.Domain}}/?language={{$.Language}}&tags={{.}}">{{.}}</a>,
    {{end}}
  </p>
  <p>
    {{.Stations}}: 

    {{range .Stations_list}}
      <a href="{{$.Domain}}/station/{{.id}}?language={{$.Language}}">{{.name}}</a>,
    {{end}}
  </p>
  <p>
    <p>
      {{.links_to_page_on_other_languages}}:
    </p>
    {{range .Languages}}
      <a rel="alternate" hreflang="{{.}}" href="{{$.Domain}}?language={{.}}">{{.}} - {{$.sitename}}</a>,
    {{end}}
  </p>
</body>

</html>
