<!DOCTYPE html>
<html lang={{.Language}}>

<head>
  <meta charSet="utf-8" />

  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0, minimum-scale=1" />

  <title>{{.sitename}}</title>
  <meta name='pagename' content="{{.sitename}}">

  <meta name='coverage' content='Worldwide'>
  <meta name='distribution' content='Global'>
  <meta name='target' content='all'>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon_120x120.png" sizes="120x120" type="image/png">

  <meta name="theme-color" content="#00a1f7" />

  <meta name="twitter:card" content="summary" />

  <meta property="og:locale" content={{.Language}} />

  <meta content="yes" name="apple-mobile-web-app-capable" />

  {{range .Languages}}
    <link rel="alternate" hreflang="{{.code}}" href="{{$.Domain}}?language={{.name}}" />

    <meta property="og:locale:alternate" content={{.code}} />
  {{end}}

  <meta property="og:site_name" content="{{.sitename}}" />

  <meta property="og:title" content="{{.sitename}}" />
  <meta name="twitter:title" content="{{.sitename}}" />

  <meta name="description" content="{{.Description}}" />
  <meta property="og:description" content="{{.Description}}" />
  <meta property="twitter:description" content="{{.Description}}" />

  <meta name="subject" content="{{.Description}}" />

  <meta name='copyright' content='radio.best'>

  <meta name='robots' content='index,follow'>

  <meta name='keywords' content="{{.keywords}}">

  <meta property="og:image" content={{.logo}} />
  <meta property="twitter:image" content={{.logo}} />

  <link rel="canonical" href="{{.Domain}}{{.URL}}" />

  <meta property="url" content="{{.Domain}}{{.URL}}" />

  <meta property="og:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:domain" content="{{.Domain}}" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RadioBroadcastService",
      "name": "{{.sitename}}",
      "description": "{{.Description}}",
      "keywords": "{{.keywords}}",
      "logo": {{.quoted_logo}},
      "url": {{.Full_url}}
    }
  </script>
</head>

<body style="font-size: 18px;">
  <p>
    {{.content}}
  </p>

  <p>
    <p>
      {{.links_to_page_on_other_languages}}:
    </p>
    <ul>
      {{range .Languages}}
        <li>
          <a rel="alternate" hreflang="{{.code}}" href="{{$.Domain}}?language={{.name}}">{{.translation}} - {{$.sitename}}</a>
        </li>
      {{end}}
    </ul>
  </p>
</body>

</html>
