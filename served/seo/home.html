<!DOCTYPE html>
<html lang={{.Language}}>

<head>
  <meta charSet="utf-8" />
  <title>{{.sitename}}</title>
  <meta name='pagename' content="{{.sitename}}">

  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0, minimum-scale=1" />

  <meta name='coverage' content='Worldwide'>
  <meta name='distribution' content='Global'>
  <meta name='target' content='all'>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <meta name="theme-color" content="#00a1f7" />

  <meta name="twitter:card" content="summary" />

  <meta property="og:locale" content={{.Language}} />

  <meta content="yes" name="apple-mobile-web-app-capable" />

  {{range .Languages}}
  <meta property="og:locale:alternate" content={{.}} />
  {{end}}

  <meta property="og:site_name" content="{{.sitename}}" />

  <meta property="og:title" content="{{.sitename}}" />
  <meta name="twitter:title" content="{{.sitename}}" />

  <meta name="description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />
  <meta property="og:description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />
  <meta property="twitter:description" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />

  <meta name="subject" content="{{.Description}} {{.Tags}}: {{range .Tags_list}}{{.}},{{end}}" />

  <meta name='copyright' content='radio.best'>

  <meta name='robots' content='index,follow'>

  <meta name='keywords' content="{{.sitename}},{{range .Tags_list}}{{.}},{{end}}">

  <meta property="og:image" content={{.logo}} />
  <meta property="twitter:image" content={{.logo}} />

  <link rel="canonical" href="{{.Domain}}{{.URL}}" />

  <meta property="url" content="{{.Domain}}{{.URL}}" />

  <meta property="og:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:domain" content="{{.Domain}}" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RadioBroadcastService",
      "name": "{{.sitename}}",
      "description": "{{.Description}}",
      "keywords": "{{range .Tags_list}}{{.}},{{end}}",
      "logo": {{.quoted_logo}},
      "url": {{.Full_url}}
    }
  </script>
</head>

<body style="font-size: 18px;">
  <p>
    {{.Description}}
  </p>
  <p>
    {{.Tags}}:
    {{range .Tags_list}}
    <a href="{{$.Domain}}/?language={{$.Language}}&tags={{.}}">{{.}}</a>,
    {{end}}
  </p>
  <p>
    {{.Stations}}:

    {{range .Stations_list}}
    <a href="{{$.Domain}}/station/{{.id}}?language={{$.Language}}">{{.name}}</a>,
    {{end}}
  </p>
  <p>
  <p>
    {{.links_to_page_on_other_languages}}:
  </p>
  {{range .Languages}}
  <a rel="alternate" hreflang="{{.}}" href="{{$.Domain}}?language={{.}}">{{.}} - {{$.sitename}}</a>,
  {{end}}
  </p>
</body>

</html>
