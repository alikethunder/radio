    <h3 id="title_text">Unfortunately, radio will not work without internet connection 🙁</h3>

  </div>


  <p id="text">Click the button below to try reloading.</p>
  <button id="button" type="button">🔄 Reload</button>

  <script>

    const translations = {
      title: {
        en: 'Hello! We are happy that you are using this radio!',
        ru: 'Привет! Мы рады, что вы используете это радио!',
        sp: '¡Hola! ¡Estamos felices de que estés usando esta radio!',
        fr: 'Bonjour ! Nous sommes heureux que vous utilisiez cette radio !',
        de: 'Hallo! Wir freuen uns, dass du diese Radio nutzt!',
        pt: 'Olá! Estamos felizes que você esteja usando esta rádio!',
      },
      title_text: {
        en: 'Unfortunately, radio will not work without internet connection 🙁',
        ru: 'К сожалению, радио не будет работать без интернет-соединения 🙁',
        sp: 'Desafortunadamente, la radio no funcionará sin conexión a Internet 🙁',
        fr: 'Malheureusement, la radio ne fonctionnera pas sans connexion Internet 🙁',
        de: 'Leider funktioniert die Radio nicht ohne Internetverbindung 🙁',
        pt: 'Infelizmente, a rádio não funcionará sem conexão com a Internet 🙁',
      },
      text: {
        en: 'Click the button below to try reloading.',
        ru: 'Нажмите кнопку ниже, чтобы попробовать перезагрузить.',
        sp: 'Haga clic en el botón de abajo para intentar volver a cargar.',
        fr: 'Cliquez sur le bouton ci-dessous pour essayer de recharger.',
        de: 'Klicken Sie auf die Schaltfläche unten, um erneut zu laden.',
        pt: 'Clique no botão abaixo para tentar recarregar.',
      },
      button: {
        en: '🔄 Reload',
        ru: '🔄 Перезагрузить',
        sp: '🔄 Recargar',
        fr: '🔄 Réessayer',
        de: '🔄 Neuladen',
        pt: '🔄 Recarregar',
      },
    };

    const nav_lang = navigator.language.substring(0, 2);

    const languages = ['en', 'ru', 'sp', 'fr', 'de', 'pt'];

    const cur_lang = languages.includes(nav_lang) ? nav_lang : (navigator.languages.find(l => languages.includes(l.substring(0, 2))) ?? 'en');

    ['title', 'title_text', 'text', 'button'].forEach(id => {
      console.log(id, 'before : ', translations[id][cur_lang], document.getElementById(id).innerHTML);

      document.getElementById(id).innerHTML = translations[id][cur_lang];

      console.log(id, 'after : ', document.getElementById(id).innerHTML);
    });

    // Manual reload feature.
    document.querySelector("button").addEventListener("click", () => {
      window.location.reload();
    });

    // Listen to changes in the network state, reload when online.
    // This handles the case when the device is completely offline.
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Check if the server is responding and reload the page if it is.
    // This handles the case when the device is online, but the server
    // is offline or misbehaving.
    async function checkNetworkAndReload() {
      try {
        const response = await fetch('.');
        // Verify we get a valid response from the server
        if (response.status >= 200 && response.status < 500) {
          window.location.reload();
          return;
        }
      } catch {
        // Unable to connect to the server, ignore.
      }
      window.setTimeout(checkNetworkAndReload, 2500);
    }

    checkNetworkAndReload();
  </script>
