<html lang={{.Language}}>

<head>
  <style id="theme_css"></style>
  <script>
    if (typeof window !== 'undefined') {
      const theme = localStorage.getItem('theme') || window?.matchMedia?.('(prefers-color-scheme:dark)')?.matches ? 'dark' : 'light'

      localStorage.setItem('theme', theme)

      fetch(`${window.location.origin}/assets/themes/soho_${theme}.css`).then(resp => {
        return resp.text()
      }).then(text => {
        document.getElementById("theme_css").innerHTML = text
      })
    }
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XSP8Y55XTL"></script>
  <script>
    if (typeof window !== 'undefined') {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());

      gtag('config', 'G-XSP8Y55XTL');
      gtag('config', 'G-XSP8Y55XTL');
    }
  </script>

  <meta charSet="utf-8" />

  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0, minimum-scale=1" />

  <title>{{.sitename}}</title>
  <meta name='pagename' content="{{.sitename}}">

  <meta name='coverage' content='Worldwide'>
  <meta name='distribution' content='Global'>
  <meta name='target' content='all'>

  <meta name="description" content="{{.Description}}" />
  <meta property="og:description" content="{{.Description}}" />
  <meta property="twitter:description" content="{{.Description}}" />

  <meta name="subject" content="{{.Description}}" />

  <link rel="manifest" href="{{.Domain}}/manifest.json" />

  <meta name='copyright' content='radio.best'>

  <meta name='robots' content='index,follow'>

  <meta name='keywords' content="{{.keywords}}">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon_120x120.png" sizes="120x120" type="image/png">

  <meta name="theme-color" content="#00a1f7" />

  <meta name="twitter:card" content="summary" />

  <meta property="og:locale" content={{.Language}} />

  {{range .Languages}}
  <link rel="alternate" hreflang="{{.code}}" href="{{$.Domain}}?language={{.name}}" />

  <meta property="og:locale:alternate" content={{.code}} />
  {{end}}

  <meta property="og:site_name" content="{{.sitename}}" />

  <meta property="og:title" content="{{.sitename}}" />
  <meta name="twitter:title" content="{{.sitename}}" />

  <meta property="og:image" content="{{.logo}}" />
  <meta property="twitter:image" content="{{.logo}}" />

  <link rel="canonical" href="{{.Domain}}{{.URL}}" />

  <meta property="url" content="{{.Domain}}{{.URL}}" />

  <meta property="og:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:url" content="{{.Domain}}{{.URL}}" />

  <meta property="twitter:domain" content="{{.Domain}}" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RadioBroadcastService",
      "name": "{{.sitename}}",
      "description": "{{.Description}}",
      "keywords": "{{.keywords}}",
      "logo": {{.quoted_logo}},
      "url": {{.Full_url}}
    }
  </script>

  <meta content="yes" name="mobile-web-app-capable" />

  <link rel="mask-icon" href="" color="#00a1f7" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">

  <script src="https://accounts.google.com/gsi/client"></script>

  <load src="./src/assets/clear_url.htm" />

    if (typeof window !== 'undefined') {
      window.addEventListener('load', function () {
        window.addEventListener('beforeinstallprompt', (e) => {

          document.dispatchEvent(event)
